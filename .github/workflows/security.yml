name: Security

on:
  push:
    branches: [master, main]
  pull_request:
  schedule:
    - cron: '0 3 * * 1'  # scan mingguan Senin 03:00 UTC

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deps:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - name: Audit dependensi (critical saja)
        run: |
          if npm audit --audit-level=critical; then
            echo "OK: no critical vulnerabilities"
          else
            echo "::warning::critical vulnerability ditemukan - lihat log audit"
          fi

  codeql:
    name: CodeQL (JavaScript)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with: { languages: javascript }
      - uses: github/codeql-action/analyze@v3
